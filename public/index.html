<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hisaab — Couples Budget</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">حساب</span>
      <div>
        <h1>Hisaab</h1>
        <p>Couples budgeting — expenses, income &amp; savings goals</p>
      </div>
    </div>
    <div class="pill" id="month-label"></div>
  </header>

  <main>
    <section class="chat">
      <div id="messages" class="messages"></div>
      <div class="quick">
        <button data-q="spent $45 on groceries">🛒 Expense</button>
        <button data-q="set food budget to $600 per month">📊 Budget</button>
        <button data-q="save $10000 for vacation">🎯 New goal</button>
        <button data-q="how are we doing this month?">📈 Summary</button>
      </div>
      <form id="composer">
        <input id="input" autocomplete="off" placeholder="Try: 'spent $50 groceries', 'Alex earned $3000 salary'…" />
        <button type="submit">Send</button>
      </form>
    </section>

    <aside class="panel">
      <div class="tabs">
        <button class="tab active" data-tab="overview">Overview</button>
        <button class="tab" data-tab="expenses">Expenses</button>
        <button class="tab" data-tab="goals">Goals</button>
      </div>
      <div id="tab-overview" class="tab-pane active">
        <div class="empty-state">
          <p>Your financial overview will appear here.</p>
          <p>Try: <em>"how are we doing this month?"</em></p>
        </div>
      </div>
      <div id="tab-expenses" class="tab-pane">
        <div class="empty-state">
          <p>Log some expenses to see them here.</p>
          <p>Try: <em>"spent $45 on groceries"</em></p>
        </div>
      </div>
      <div id="tab-goals" class="tab-pane">
        <div class="empty-state">
          <p>Set up savings goals to track them here.</p>
          <p>Try: <em>"save $5000 for vacation"</em></p>
        </div>
      </div>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
